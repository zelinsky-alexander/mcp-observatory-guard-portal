# This file is intended for nginx's http context (normally conf.d). Replace the
# hostname and certificate paths before enabling it.
limit_req_zone $binary_remote_addr zone=mcp_portal_public:10m rate=10r/s;

upstream mcp_portal_public_backend {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name observatory.example.org;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name observatory.example.org;
    server_tokens off;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    ssl_certificate /etc/letsencrypt/live/observatory.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/observatory.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MCPPortalTLS:10m;
    ssl_session_tickets off;

    client_max_body_size 1k;
    client_body_timeout 5s;
    keepalive_timeout 15s;
    send_timeout 15s;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        limit_except GET { deny all; }
        limit_req zone=mcp_portal_public burst=30 nodelay;

        proxy_pass http://mcp_portal_public_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
        proxy_send_timeout 10s;
        proxy_buffering on;
        proxy_request_buffering on;
    }
}
